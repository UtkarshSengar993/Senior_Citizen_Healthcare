    <script>
        function toggleNav() {
            var sidepanel = document.getElementById("mySidepanel");
            if (sidepanel.style.width === "500px") {
                closeNav();
            } else {
                openNav();
            }
        }

        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
    </script>
