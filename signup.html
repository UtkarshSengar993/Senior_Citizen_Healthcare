<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(222, 129, 8);
            color: #333;
            margin: 0;
            padding: 0;
            background-image:url("yoga 17.jpg") ;
        }

        form {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #d2cccc;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            border: #333 dotted;
        }

        h2 {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        input[type="submit"] {
            background-color: #2ecc71;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <form action="submit_signup.php" method="post">
        <h2>Sign Up</h2>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" required>
        
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required>
        
        <label for="disease">Disease</label>
        <input type="text" id="disease" name="disease" required>

        <label>Membership Type:</label>
        <input type="radio" id="free" name="membership" value="free" checked>
        <label for="free">Free Package</label>
        <input type="radio" id="paid" name="membership" value="paid">
        <label for="paid">Paid Membership</label>
            <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <!--<input type="submit" value="Sign Up">-->
        <button>
            <a href="hospital_home.html">Submit</a>
         </button>
    </form>
</body>
</html>
