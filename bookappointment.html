<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: antiquewhite;
            color: #333;
            margin: 0;
            padding: 0;
            background-image: url("yoga\ 18.jpg") ;
            background-image: no-repeat;
            background-size: cover;
            background-position: center;
        }

        form {
            max-width: 400px auto;
            margin: 1% auto;
            padding: 100px;
            background-color: transparent;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #1b1010;
            border-radius: 4px;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #c49797;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #2ecc71;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #434d29;
        }
    </style>
</head>
<body>
    <form id="appointmentForm" action="submit_appointment.php" method="post">
        <h2>Book Appointment</h2>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <label for="doctor">Doctor</label>
        <select id="doctor" name="doctor" required>
            <option value="Dr. Ravi">Dr. Ravi Gupta </option>
            <option value="Dr. Karthik">Dr. Karthik Singh Rajoot</option>
            <option value="Dr. manoj">Dr. Manoj Kapoor</option>
        </select>

        <label for="appointment_type">Appointment Type</label>
        <select id="appointment_type" name="appointment_type" required>
            <option value="Live">Live</option>
            <option value="Virtual">Virtual</option>
        </select>

        <!-- <input type="submit" value="Book Appointment" onclick="submitForm()"> -->
         <button>
            <a href="hospital_home.html">Submit</a>
         </button>
    </form>

    <script>
        function submitForm() {
            alert("Appointment is submitted.");
        }
    </script>
    <script>
        function submitForm() {
            alert("Appointment is submitted.");
            window.location.href = "Web Home Page.HTML";
        }
    </script>
    
</body>
</html>
